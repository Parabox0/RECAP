[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recap-context"
version = "0.1.0"
description = "Recency-aware Context Assembly Protocol: small, verified update packets for LLM harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RECAP contributors" }]
keywords = ["llm", "context", "freshness", "rag", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/Parabox0/RECAP"
Repository = "https://github.com/Parabox0/RECAP"
Issues = "https://github.com/Parabox0/RECAP/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
recap = "recap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recap = ["_example/*.toml", "_example/profiles/*.toml", "_example/fixtures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
